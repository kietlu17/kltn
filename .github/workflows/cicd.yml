name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cicd-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: agentic rag/requirements.txt
      - name: Test agentic-rag
        working-directory: agentic rag
        run: |
          pip install -r requirements.txt pytest
          python -m pytest -q tests
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build frontend
        working-directory: frontend
        run: npm ci && npm run build
      - name: Validate compose files
        run: |
          touch .env payment-service/.env
          DOCKERHUB_USERNAME=ci POSTGRES_PASSWORD=ci JWT_SECRET=ci \
            docker compose -f docker-compose.yml -f docker-compose.prod.yml config -q

  build:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 8
      matrix:
        include:
          - { name: auth-service, dockerfile: auth-service/Dockerfile }
          - { name: user-service, dockerfile: user-service/Dockerfile }
          - { name: shop-service, dockerfile: shop-service/Dockerfile }
          - { name: product-service, dockerfile: product-service/Dockerfile }
          - { name: cart-service, dockerfile: cart-service/Dockerfile }
          - { name: order-service, dockerfile: order-service/Dockerfile }
          - { name: inventory-service, dockerfile: inventory-service/Dockerfile }
          - { name: voucher-service, dockerfile: voucher-service/Dockerfile }
          - { name: review-service, dockerfile: review-service/Dockerfile }
          - { name: chat-service, dockerfile: chat-service/Dockerfile }
          - { name: payment-service, dockerfile: payment-service/Dockerfile }
          - { name: wallet-service, dockerfile: wallet-service/Dockerfile }
          - { name: payment-gateway, dockerfile: payment-gateway/Dockerfile }
          - { name: api-gateway, dockerfile: api-gateway/Dockerfile }
          - { name: chatbot-service, dockerfile: chatbot-service/Dockerfile }
          - { name: agentic-rag, dockerfile: agentic rag/Dockerfile }
          - { name: web, dockerfile: deploy/web.Dockerfile }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          provenance: false
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/ecommerce-${{ matrix.name }}:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/ecommerce-${{ matrix.name }}:latest
          cache-from: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/ecommerce-${{ matrix.name }}:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/ecommerce-${{ matrix.name }}:buildcache,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      TARGET: deploy@${{ secrets.VPS_HOST }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          (umask 077; printf '%s\n' "$SSH_KEY" | tr -d '\r' > ~/.ssh/id_ed25519)
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Copy deployment files
        run: |
          rsync -az --relative docker-compose.yml docker-compose.prod.yml docker deploy output/pdf "$TARGET:/opt/ecommerce/"
      - name: Roll out
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          trap 'ssh "$TARGET" docker logout' EXIT
          printf '%s' "$DOCKERHUB_TOKEN" | ssh "$TARGET" "docker login -u '$DOCKERHUB_USERNAME' --password-stdin"
          ssh -o ServerAliveInterval=30 "$TARGET" "bash /opt/ecommerce/deploy/deploy.sh '$GITHUB_SHA'"
