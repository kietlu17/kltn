<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Buyer use cases · Use case</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1100px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    .scroll { overflow-x: auto; }
    svg { width: 100%; min-width: 1040px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Use case · ecommerce-microservices · Buyer</p>
    <h1>What a buyer can do on the platform</h1>

    <div class="scroll">
    <svg viewBox="0 0 1040 640" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="usecase-buyer-title usecase-buyer-desc">
      <title id="usecase-buyer-title">Buyer use cases</title>
      <desc id="usecase-buyer-desc">A buyer browses products, manages the cart, places and tracks orders and tops up the wallet; placing an order always includes paying it and may be extended by a voucher, and SePay takes part in QR payment and wallet top-up.</desc>
      <defs>
        <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
          <circle cx="1" cy="1" r="0.9" fill="rgba(45,49,66,0.10)"/>
        </pattern>
        <marker id="arrow-open" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polyline points="0 0, 8 3, 0 6" fill="none" stroke="#4f5d75" stroke-width="1.2"/>
        </marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>
      <rect width="100%" height="100%" fill="url(#dots)" opacity="0.55"/>

      <!-- SYSTEM BOUNDARY -->
      <rect x="232" y="104" width="584" height="432" rx="6" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="248" y="124" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">SYSTEM · E-COMMERCE PLATFORM</text>

      <!-- ASSOCIATIONS — Buyer fans out from distinct attach points -->
      <g fill="none" stroke="#4f5d75" stroke-width="1.2">
        <path d="M120,296 H152 A8,8 0 0 0 160,288 V160 A8,8 0 0 1 168,152 H280"/>
        <path d="M120,308 H168 A8,8 0 0 0 176,300 V240 A8,8 0 0 1 184,232 H280"/>
        <path d="M120,320 H280"/>
        <path d="M120,332 H168 A8,8 0 0 1 176,340 V400 A8,8 0 0 0 184,408 H280"/>
        <path d="M120,344 H152 A8,8 0 0 1 160,352 V480 A8,8 0 0 0 168,488 H280"/>
        <!-- SePay -->
        <path d="M778,314 H916"/>
        <path d="M480,488 H928 A8,8 0 0 0 936,480 V364"/>
      </g>

      <!-- «extend»: Apply voucher → Place order -->
      <path d="M580,232 H516 A8,8 0 0 0 508,240 V300 A8,8 0 0 1 500,308 H468" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow-open)"/>
      <rect x="516" y="264" width="60" height="12" rx="2" fill="#f5f5f5"/>
      <text x="546" y="274" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">«EXTEND»</text>

      <!-- «include»: Place order → Pay order -->
      <path d="M480,320 H580" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow-open)"/>
      <rect x="496" y="330" width="68" height="12" rx="2" fill="#f5f5f5"/>
      <text x="530" y="340" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">«INCLUDE»</text>

      <!-- USE CASES — column A (cx 380) -->
      <g font-family="'Geist', sans-serif">
        <ellipse cx="380" cy="152" rx="100" ry="24" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="380" y="151" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle">Browse products</text>
        <text x="380" y="164" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">product · review</text>

        <ellipse cx="380" cy="232" rx="100" ry="24" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="380" y="231" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle">Manage cart</text>
        <text x="380" y="244" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">cart-service</text>

        <ellipse cx="380" cy="320" rx="100" ry="24" fill="#fbeee9" stroke="#bf4520" stroke-width="1.2"/>
        <text x="380" y="319" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle">Place order</text>
        <text x="380" y="332" fill="#bf4520" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">checkout quote → order</text>

        <ellipse cx="380" cy="408" rx="100" ry="24" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="380" y="407" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle">Track / cancel order</text>
        <text x="380" y="420" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">order-service</text>

        <ellipse cx="380" cy="488" rx="100" ry="24" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="380" y="487" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle">Top up wallet</text>
        <text x="380" y="500" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">wallet · sepay-qr</text>

        <!-- column B (cx 680) -->
        <ellipse cx="680" cy="232" rx="100" ry="24" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="680" y="231" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle">Apply voucher</text>
        <text x="680" y="244" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">voucher-service</text>

        <ellipse cx="680" cy="320" rx="100" ry="24" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="680" y="319" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle">Pay order</text>
        <text x="680" y="332" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">wallet · cod · sepay qr</text>
      </g>

      <!-- ACTOR: Buyer (primary, left) -->
      <g fill="none" stroke="#2d3142" stroke-width="1.4" stroke-linecap="round">
        <circle cx="96" cy="284" r="12" fill="#f5f5f5"/>
        <line x1="96" y1="296" x2="96" y2="328"/>
        <line x1="76" y1="308" x2="116" y2="308"/>
        <line x1="96" y1="328" x2="80" y2="352"/>
        <line x1="96" y1="328" x2="112" y2="352"/>
      </g>
      <text x="96" y="248" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Buyer</text>
      <text x="96" y="262" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">frontend</text>

      <!-- ACTOR: SePay (external, right) -->
      <g fill="none" stroke="#2e5aa8" stroke-width="1.4" stroke-linecap="round">
        <circle cx="936" cy="284" r="12" fill="#f5f5f5"/>
        <line x1="936" y1="296" x2="936" y2="328"/>
        <line x1="916" y1="308" x2="956" y2="308"/>
        <line x1="936" y1="328" x2="920" y2="352"/>
        <line x1="936" y1="328" x2="952" y2="352"/>
      </g>
      <text x="936" y="248" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">SePay</text>
      <text x="936" y="262" fill="#2e5aa8" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">bank QR · webhook</text>

      <!-- LEGEND -->
      <line x1="48" y1="568" x2="992" y2="568" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="48" y="584" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

      <g fill="none" stroke="#2d3142" stroke-width="1" stroke-linecap="round">
        <circle cx="54" cy="603" r="3"/>
        <line x1="54" y1="606" x2="54" y2="612"/>
        <line x1="50" y1="608" x2="58" y2="608"/>
        <line x1="54" y1="612" x2="51" y2="617"/>
        <line x1="54" y1="612" x2="57" y2="617"/>
      </g>
      <text x="68" y="612" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Actor</text>

      <ellipse cx="164" cy="609" rx="16" ry="7" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="188" y="612" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Use case</text>

      <ellipse cx="284" cy="609" rx="16" ry="7" fill="#fbeee9" stroke="#bf4520" stroke-width="1.2"/>
      <text x="308" y="612" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Core use case</text>

      <line x1="416" y1="609" x2="444" y2="609" stroke="#4f5d75" stroke-width="1.2"/>
      <text x="452" y="612" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Association</text>

      <line x1="544" y1="609" x2="572" y2="609" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow-open)"/>
      <text x="580" y="612" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">«include» / «extend»</text>

      <rect x="704" y="600" width="28" height="18" rx="3" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="740" y="612" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">System boundary</text>
    </svg>
    </div>
  </div>
</body>
</html>
