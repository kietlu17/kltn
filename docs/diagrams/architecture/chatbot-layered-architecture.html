    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink); min-height: 100vh; display: flex; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1200px; width: 100%; min-width: 0; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow { font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.5rem; }
    h1 { font-family: var(--font-serif); font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight: 400; letter-spacing: -0.02em; line-height: 1.15; margin-bottom: 1.5rem; }
    .caption { font-family: var(--font-serif); font-style: italic; font-size: 1.05rem; color: var(--color-muted); text-align: center; margin-top: 1rem; }
    svg { width: 100%; min-width: 1200px; display: block; }
    @media (max-width: 860px) { body { padding: 2rem 16px; } }
    @media print { .diagram-container { overflow-x: visible; } svg { min-width: 0; } }

</head>
