services:
  certs-init:
    image: alpine:3.20
    container_name: certs-init
    command: sh -c "apk add --no-cache openssl >/dev/null && sh /scripts/generate-certs.sh"
    volumes:
      - certs_data:/certs
      - ./docker/certs:/scripts:ro

  mongo:
    image: mongo:7
    container_name: mongo
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "mongodb://localhost:27017/admin", "--eval", "db.runCommand({ ping: 1 }).ok"]
      interval: 10s
      timeout: 5s
      retries: 10
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  postgres:
    image: postgres:15
    container_name: postgres
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 10
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/db-init:/docker-entrypoint-initdb.d:ro

  kafka_e:
    image: apache/kafka:4.2.0-rc2
    container_name: kafka-e
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,INTERNAL://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,INTERNAL://kafka-e:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-e:9093
      KAFKA_CLUSTERS_0_NAME: event-cluster
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes:
      - kafka_data:/var/lib/kafka/data

  kafka-ui_e:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui-e
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: event-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka-e:29092
      KAFKA_CLUSTERS_0_READONLY: "false"
    depends_on:
      - kafka_e

  minio:
    image: minio/minio:latest
    container_name: minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  minio-init:
    image: minio/mc:latest
    container_name: minio-init
    restart: "no"
    entrypoint: /bin/sh
    command: >
      -c "until mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD}; do sleep 2; done;
      mc mb --ignore-existing local/$${PRODUCT_IMAGE_BUCKET};
      mc anonymous set download local/$${PRODUCT_IMAGE_BUCKET};"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      PRODUCT_IMAGE_BUCKET: ${PRODUCT_IMAGE_BUCKET:-product-images}
    depends_on:
      - minio

  auth-service:
    build:
      context: .
      dockerfile: auth-service/Dockerfile
    container_name: auth-service
    restart: unless-stopped
    environment:
      PORT: 3001
      MONGO_URI: mongodb://mongo:27017/auth-service
      USER_SERVICE_URL: https://user-service:3002
      SHOP_SERVICE_URL: https://shop-service:3003
      TLS_ENABLED: "true"
      TLS_REQUEST_CLIENT_CERT: "true"
      TLS_REJECT_UNAUTHORIZED: "true"
      TLS_CA_PATH: /certs/ca/ca.crt
      TLS_CERT_PATH: /certs/auth-service/tls.crt
      TLS_KEY_PATH: /certs/auth-service/tls.key
      MTLS_ENABLED: "true"
      MTLS_REJECT_UNAUTHORIZED: "true"
      MTLS_CA_PATH: /certs/ca/ca.crt
      MTLS_CLIENT_CERT_PATH: /certs/auth-service/tls.crt
      MTLS_CLIENT_KEY_PATH: /certs/auth-service/tls.key
    volumes:
      - certs_data:/certs:ro
    depends_on:
      certs-init:
        condition: service_completed_successfully
      mongo:
        condition: service_healthy

  user-service:
    build:
      context: .
      dockerfile: user-service/Dockerfile
    container_name: user-service
    restart: unless-stopped
    environment:
      PORT: 3002
      MONGO_URI: mongodb://mongo:27017/user-service
      TLS_ENABLED: "true"
      TLS_REQUEST_CLIENT_CERT: "true"
      TLS_REJECT_UNAUTHORIZED: "true"
      TLS_CA_PATH: /certs/ca/ca.crt
      TLS_CERT_PATH: /certs/user-service/tls.crt
      TLS_KEY_PATH: /certs/user-service/tls.key
    volumes:
      - certs_data:/certs:ro
    depends_on:
      certs-init:
        condition: service_completed_successfully
      mongo:
        condition: service_healthy

  shop-service:
    build:
      context: .
      dockerfile: shop-service/Dockerfile
    container_name: shop-service
    restart: unless-stopped
    environment:
      PORT: 3003
      MONGO_URI: mongodb://mongo:27017/shop-service
      TLS_ENABLED: "true"
      TLS_REQUEST_CLIENT_CERT: "true"
      TLS_REJECT_UNAUTHORIZED: "true"
      TLS_CA_PATH: /certs/ca/ca.crt
      TLS_CERT_PATH: /certs/shop-service/tls.crt
      TLS_KEY_PATH: /certs/shop-service/tls.key
    volumes:
      - certs_data:/certs:ro
    depends_on:
      certs-init:
        condition: service_completed_successfully
      mongo:
        condition: service_healthy

  product-service:
    build:
      context: .
      dockerfile: product-service/Dockerfile
    container_name: product-service
    restart: unless-stopped
    environment:
      PORT: 3004
      MONGO_URI: mongodb://mongo:27017/product-service
      KAFKA_BROKER: kafka-e:29092
      MINIO_ENDPOINT: http://minio:9000
      MINIO_REGION: ${MINIO_REGION:-us-east-1}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      PRODUCT_IMAGE_BUCKET: ${PRODUCT_IMAGE_BUCKET:-product-images}
      PRODUCT_IMAGE_PUBLIC_BASE_URL: ${PRODUCT_IMAGE_PUBLIC_BASE_URL:-http://localhost:9000/product-images}
      TLS_ENABLED: "true"
      TLS_REQUEST_CLIENT_CERT: "true"
      TLS_REJECT_UNAUTHORIZED: "true"
      TLS_CA_PATH: /certs/ca/ca.crt
      TLS_CERT_PATH: /certs/product-service/tls.crt
      TLS_KEY_PATH: /certs/product-service/tls.key
    volumes:
      - certs_data:/certs:ro
    depends_on:
      certs-init:
        condition: service_completed_successfully
      mongo:
        condition: service_healthy
      kafka_e:
        condition: service_started
      minio-init:
        condition: service_completed_successfully

  cart-service:
    build:
      context: .
      dockerfile: cart-service/Dockerfile
    container_name: cart-service
    restart: unless-stopped
    environment:
      PORT: 3005
      MONGO_URI: mongodb://mongo:27017/cart-service
      PRODUCT_SERVICE_URL: https://product-service:3004
      INVENTORY_SERVICE_URL: https://inventory-service:3007
      CART_MAX_LINE_QUANTITY: ${CART_MAX_LINE_QUANTITY:-100}
      TLS_ENABLED: "true"
      TLS_REQUEST_CLIENT_CERT: "true"
      TLS_REJECT_UNAUTHORIZED: "true"
      TLS_CA_PATH: /certs/ca/ca.crt
      TLS_CERT_PATH: /certs/cart-service/tls.crt
      TLS_KEY_PATH: /certs/cart-service/tls.key
      MTLS_ENABLED: "true"
      MTLS_REJECT_UNAUTHORIZED: "true"
      MTLS_CA_PATH: /certs/ca/ca.crt
      MTLS_CLIENT_CERT_PATH: /certs/cart-service/tls.crt
      MTLS_CLIENT_KEY_PATH: /certs/cart-service/tls.key
    volumes:
      - certs_data:/certs:ro
    depends_on:
      certs-init:
        condition: service_completed_successfully
      mongo:
        condition: service_healthy
      product-service:
        condition: service_started
      inventory-service:
        condition: service_started

  order-service:
    build:
      context: .
      dockerfile: order-service/Dockerfile
    container_name: order-service
    restart: unless-stopped
    environment:
      PORT: 3006
      PG_HOST: postgres
      PG_PORT: 5432
      PG_DATABASE: order_service
      PG_USER: postgres
      PG_PASSWORD: postgres
      INVENTORY_SERVICE_URL: https://inventory-service:3007
      VOUCHER_SERVICE_URL: https://voucher-service:3013
      PRODUCT_SERVICE_URL: https://product-service:3004
      USER_SERVICE_URL: https://user-service:3002
      ORDER_SERVICE_URL: https://order-service:3006
      CHECKOUT_QUOTE_TTL_SECONDS: ${CHECKOUT_QUOTE_TTL_SECONDS:-600}
      KAFKA_BROKER: kafka-e:29092
      SETTLEMENT_DELAY_DAYS: ${SETTLEMENT_DELAY_DAYS:-15}
      TLS_ENABLED: "true"
      TLS_REQUEST_CLIENT_CERT: "true"
      TLS_REJECT_UNAUTHORIZED: "true"
      TLS_CA_PATH: /certs/ca/ca.crt
      TLS_CERT_PATH: /certs/order-service/tls.crt
      TLS_KEY_PATH: /certs/order-service/tls.key
      MTLS_ENABLED: "true"
      MTLS_REJECT_UNAUTHORIZED: "true"
      MTLS_CA_PATH: /certs/ca/ca.crt
      MTLS_CLIENT_CERT_PATH: /certs/order-service/tls.crt
      MTLS_CLIENT_KEY_PATH: /certs/order-service/tls.key
    volumes:
      - certs_data:/certs:ro
    depends_on:
      certs-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      kafka_e:
        condition: service_started
      product-service:
        condition: service_started
      user-service:
        condition: service_started
      inventory-service:
        condition: service_started
      voucher-service:
        condition: service_started

  inventory-service:
    build:
      context: .
      dockerfile: inventory-service/Dockerfile
    container_name: inventory-service
    restart: unless-stopped
    environment:
      PORT: 3007
      PG_HOST: postgres
      PG_PORT: 5432
      PG_DATABASE: inventory_service
      PG_USER: postgres
      PG_PASSWORD: postgres
      KAFKA_BROKER: kafka-e:29092
      TLS_ENABLED: "true"
      TLS_REQUEST_CLIENT_CERT: "true"
      TLS_REJECT_UNAUTHORIZED: "true"
      TLS_CA_PATH: /certs/ca/ca.crt
      TLS_CERT_PATH: /certs/inventory-service/tls.crt
      TLS_KEY_PATH: /certs/inventory-service/tls.key
    volumes:
      - certs_data:/certs:ro
    depends_on:
      certs-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      kafka_e:
        condition: service_started

  voucher-service:
    build:
      context: .
      dockerfile: voucher-service/Dockerfile
    container_name: voucher-service
    restart: unless-stopped
    environment:
      PORT: 3013
      PG_HOST: postgres
      PG_PORT: 5432
      PG_DATABASE: voucher_service
      PG_USER: postgres
      PG_PASSWORD: postgres
      TLS_ENABLED: "true"
      TLS_REQUEST_CLIENT_CERT: "true"
      TLS_REJECT_UNAUTHORIZED: "true"
      TLS_CA_PATH: /certs/ca/ca.crt
      TLS_CERT_PATH: /certs/voucher-service/tls.crt
      TLS_KEY_PATH: /certs/voucher-service/tls.key
    volumes:
      - certs_data:/certs:ro
    depends_on:
      certs-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy

  review-service:
    build:
      context: .
      dockerfile: review-service/Dockerfile
    container_name: review-service
    restart: unless-stopped
    environment:
      PORT: 3008
      MONGO_URI: mongodb://mongo:27017/review-service
      ORDER_SERVICE_URL: https://order-service:3006
      PRODUCT_SERVICE_URL: https://product-service:3004
      TLS_ENABLED: "true"
      TLS_REQUEST_CLIENT_CERT: "true"
      TLS_REJECT_UNAUTHORIZED: "true"
      TLS_CA_PATH: /certs/ca/ca.crt
      TLS_CERT_PATH: /certs/review-service/tls.crt
      TLS_KEY_PATH: /certs/review-service/tls.key
      MTLS_ENABLED: "true"
      MTLS_REJECT_UNAUTHORIZED: "true"
      MTLS_CA_PATH: /certs/ca/ca.crt
      MTLS_CLIENT_CERT_PATH: /certs/review-service/tls.crt
      MTLS_CLIENT_KEY_PATH: /certs/review-service/tls.key
    volumes:
      - certs_data:/certs:ro
    depends_on:
      certs-init:
        condition: service_completed_successfully
      mongo:
        condition: service_healthy

  chat-service:
    build:
      context: .
      dockerfile: chat-service/Dockerfile
    container_name: chat-service
    restart: unless-stopped
    environment:
      PORT: 3009
      MONGO_URI: mongodb://mongo:27017/chat-service
      TLS_ENABLED: "true"
      TLS_REQUEST_CLIENT_CERT: "true"
      TLS_REJECT_UNAUTHORIZED: "true"
      TLS_CA_PATH: /certs/ca/ca.crt
      TLS_CERT_PATH: /certs/chat-service/tls.crt
      TLS_KEY_PATH: /certs/chat-service/tls.key
    volumes:
      - certs_data:/certs:ro
    depends_on:
      certs-init:
        condition: service_completed_successfully
      mongo:
        condition: service_healthy

  qdrant:
    image: qdrant/qdrant:v1.19.0
    restart: unless-stopped
    volumes:
      - chatbot_vectors:/qdrant/storage

  chatbot-service:
    build:
      context: .
      dockerfile: chatbot-service/Dockerfile
    restart: unless-stopped
    environment: &chatbot-environment
      CHATBOT_EMBEDDING_MODEL: ${CHATBOT_EMBEDDING_MODEL:-gemini-embedding-001}
      CHATBOT_EMBEDDING_DIMENSIONS: ${CHATBOT_EMBEDDING_DIMENSIONS:-768}
      CHATBOT_PRODUCT_LLM_EVALUATOR: ${CHATBOT_PRODUCT_LLM_EVALUATOR:-always}
      CHATBOT_MODEL_MAX_RETRIES: ${CHATBOT_MODEL_MAX_RETRIES:-1}
      CHATBOT_LLM_COOLDOWN_SECONDS: ${CHATBOT_LLM_COOLDOWN_SECONDS:-60}
      CHATBOT_EMBED_CACHE_SIZE: ${CHATBOT_EMBED_CACHE_SIZE:-512}
      CHATBOT_EVENT_BATCH_SIZE: ${CHATBOT_EVENT_BATCH_SIZE:-20}
      CHATBOT_EVENT_BATCH_MS: ${CHATBOT_EVENT_BATCH_MS:-1000}
      CHATBOT_INDEX_RETRY_SECONDS: ${CHATBOT_INDEX_RETRY_SECONDS:-15}
      CHATBOT_MAX_CAPTION_IMAGES: ${CHATBOT_MAX_CAPTION_IMAGES:-0}
      CHATBOT_CONTEXT_HISTORY_MESSAGES: ${CHATBOT_CONTEXT_HISTORY_MESSAGES:-8}
      CHATBOT_CONTEXT_HISTORY_CHARS: ${CHATBOT_CONTEXT_HISTORY_CHARS:-6000}
      CHATBOT_SESSION_PRODUCT_LIMIT: ${CHATBOT_SESSION_PRODUCT_LIMIT:-6}
      CHATBOT_SHOPPING_CONTEXT_TTL_SECONDS: ${CHATBOT_SHOPPING_CONTEXT_TTL_SECONDS:-21600}
      CHATBOT_IMAGE_CONTEXT_TTL_SECONDS: ${CHATBOT_IMAGE_CONTEXT_TTL_SECONDS:-3600}
      CHATBOT_PENDING_ACTION_TTL_SECONDS: ${CHATBOT_PENDING_ACTION_TTL_SECONDS:-600}
      CHATBOT_IMAGE_EMBED_URL: http://image-embedding:3022
      CHATBOT_IMAGE_MODEL: ${CHATBOT_IMAGE_MODEL:-openai/clip-vit-base-patch32}
      CHATBOT_IMAGE_REVISION: ${CHATBOT_IMAGE_REVISION:-3d74acf9a28c67741b2f4f2ea7635f0aaf6f0268}
      CHATBOT_IMAGE_MIN_SCORE: ${CHATBOT_IMAGE_MIN_SCORE:-0.65}
      CHATBOT_WHISPER_MODEL: ${CHATBOT_WHISPER_MODEL:-base}
      CHATBOT_STT_LANGUAGE: ${CHATBOT_STT_LANGUAGE:-vi}
      CHATBOT_GEMINI_MODEL: ${CHATBOT_GEMINI_MODEL:-gemini-2.5-flash}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      CHATBOT_MODEL_TIMEOUT: ${CHATBOT_MODEL_TIMEOUT:-120}
      CHATBOT_MIN_SCORE: ${CHATBOT_MIN_SCORE:-0.35}
      CHATBOT_SIMILAR_MIN_SCORE: ${CHATBOT_SIMILAR_MIN_SCORE:-0.5}
      CHATBOT_DATA_DIR: /data
      CHATBOT_SYNC_SECONDS: ${CHATBOT_SYNC_SECONDS:-300}
      CHATBOT_IMAGE_HOSTS: ${CHATBOT_IMAGE_HOSTS:-salt.tikicdn.com,cdn.tgdd.vn,cdnv2.tgdd.vn}
      CHATBOT_POLICY_PDF_PATHS: ${CHATBOT_POLICY_PDF_PATHS:-/policies/shopee-help}
      CHATBOT_POLICY_EMBED_BATCH_SIZE: ${CHATBOT_POLICY_EMBED_BATCH_SIZE:-50}
      CHATBOT_POLICY_EMBED_RETRIES: ${CHATBOT_POLICY_EMBED_RETRIES:-10}
      CHATBOT_POLICY_EMBED_DELAY_SECONDS: ${CHATBOT_POLICY_EMBED_DELAY_SECONDS:-0.5}
      QDRANT_URL: http://qdrant:6333
      PRODUCT_SERVICE_URL: https://product-service:3004
      INVENTORY_SERVICE_URL: https://inventory-service:3007
      REVIEW_SERVICE_URL: https://review-service:3008
      CART_SERVICE_URL: https://cart-service:3005
      ORDER_SERVICE_URL: https://order-service:3006
      VOUCHER_SERVICE_URL: https://voucher-service:3013
      USER_SERVICE_URL: https://user-service:3002
      CHATBOT_RERANK_CANDIDATES: ${CHATBOT_RERANK_CANDIDATES:-30}
      CHATBOT_RERANK_BAYESIAN_PRIOR: ${CHATBOT_RERANK_BAYESIAN_PRIOR:-20}
      CHATBOT_SHOPPING_WEB_RESEARCH: ${CHATBOT_SHOPPING_WEB_RESEARCH:-true}
      PRODUCT_IMAGE_PUBLIC_BASE_URL: ${PRODUCT_IMAGE_PUBLIC_BASE_URL:-http://localhost:9000/product-images}
      KAFKA_BROKER: kafka-e:29092
      MTLS_ENABLED: "true"
      MTLS_CA_PATH: /certs/ca/ca.crt
      MTLS_CLIENT_CERT_PATH: /certs/chatbot-service/tls.crt
      MTLS_CLIENT_KEY_PATH: /certs/chatbot-service/tls.key
    volumes:
      - certs_data:/certs:ro
      - chatbot_data:/data
    depends_on:
      certs-init:
        condition: service_completed_successfully
      qdrant:
        condition: service_started
      product-service:
        condition: service_started
      inventory-service:
        condition: service_started
      review-service:
        condition: service_started
      cart-service:
        condition: service_started
      voucher-service:
        condition: service_started
      order-service:
        condition: service_started
      user-service:
        condition: service_started

  image-embedding:
    build:
      context: .
      dockerfile: chatbot-service/Dockerfile
    command: ["uvicorn", "src.image_embedding:app", "--host", "0.0.0.0", "--port", "3022", "--workers", "1"]
    restart: unless-stopped
    environment:
      HF_HOME: /data/huggingface
      CHATBOT_IMAGE_MODEL: ${CHATBOT_IMAGE_MODEL:-openai/clip-vit-base-patch32}
      CHATBOT_IMAGE_REVISION: ${CHATBOT_IMAGE_REVISION:-3d74acf9a28c67741b2f4f2ea7635f0aaf6f0268}
    volumes:
      - chatbot_data:/data

  chatbot-image-indexer:
    build:
      context: .
      dockerfile: chatbot-service/Dockerfile
    command: ["python", "-m", "src.product.image_indexer"]
    restart: unless-stopped
    environment: *chatbot-environment
    volumes:
      - certs_data:/certs:ro
      - chatbot_data:/data
    depends_on:
      chatbot-service:
        condition: service_started
      image-embedding:
        condition: service_started

  chatbot-indexer:
    build:
      context: .
      dockerfile: chatbot-service/Dockerfile
    restart: unless-stopped
    command: ["python", "-m", "src.product.indexer"]
    environment:
      <<: *chatbot-environment
      CHATBOT_EMBED_BATCH_SIZE: ${CHATBOT_EMBED_BATCH_SIZE:-70}
      CHATBOT_EMBED_BATCH_INTERVAL_SECONDS: ${CHATBOT_EMBED_BATCH_INTERVAL_SECONDS:-61}
      CHATBOT_EMBED_RATE_LIMIT_RETRIES: ${CHATBOT_EMBED_RATE_LIMIT_RETRIES:-5}
    volumes:
      - certs_data:/certs:ro
      - chatbot_data:/data
    depends_on:
      chatbot-service:
        condition: service_started
      kafka_e:
        condition: service_started

  chatbot-policy-indexer:
    build:
      context: .
      dockerfile: chatbot-service/Dockerfile
    restart: unless-stopped
    command: ["python", "-m", "src.policy.indexer"]
    environment: *chatbot-environment
    volumes:
      - certs_data:/certs:ro
      - chatbot_data:/data
      - ./output/pdf:/policies:ro
    depends_on:
      chatbot-service:
        condition: service_started
      qdrant:
        condition: service_started

  payment-service:
    build:
      context: .
      dockerfile: payment-service/Dockerfile
    container_name: payment-service
    restart: unless-stopped
    env_file:
      - ./payment-service/.env
    environment:
      PORT: 3010
      PG_HOST: postgres
      PG_PORT: 5432
      PG_DATABASE: payment_service
      PG_USER: postgres
      PG_PASSWORD: postgres
      WALLET_DEFAULT_BALANCE: 0
      KAFKA_BROKER: kafka-e:29092
      OUTBOX_POLL_INTERVAL_MS: 500
      TLS_ENABLED: "true"
      TLS_REQUEST_CLIENT_CERT: "true"
      TLS_REJECT_UNAUTHORIZED: "true"
      TLS_CA_PATH: /certs/ca/ca.crt
      TLS_CERT_PATH: /certs/payment-service/tls.crt
      TLS_KEY_PATH: /certs/payment-service/tls.key
    volumes:
      - certs_data:/certs:ro
    depends_on:
      certs-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      kafka_e:
        condition: service_started

  wallet-service:
    build:
      context: .
      dockerfile: wallet-service/Dockerfile
    container_name: wallet-service
    restart: unless-stopped
    environment:
      PORT: 3011
      PG_HOST: postgres
      PG_PORT: 5432
      PG_DATABASE: wallet_service
      PG_USER: postgres
      PG_PASSWORD: postgres
      WALLET_DEFAULT_BALANCE: 0
      KAFKA_BROKER: kafka-e:29092
      OUTBOX_POLL_INTERVAL_MS: 500
      SETTLEMENT_DELAY_DAYS: ${SETTLEMENT_DELAY_DAYS:-15}
      SETTLEMENT_WORKER_INTERVAL_MS: ${SETTLEMENT_WORKER_INTERVAL_MS:-60000}
      PLATFORM_INITIAL_CAPITAL: ${PLATFORM_INITIAL_CAPITAL:-100000000}
      TLS_ENABLED: "true"
      TLS_REQUEST_CLIENT_CERT: "true"
      TLS_REJECT_UNAUTHORIZED: "true"
      TLS_CA_PATH: /certs/ca/ca.crt
      TLS_CERT_PATH: /certs/wallet-service/tls.crt
      TLS_KEY_PATH: /certs/wallet-service/tls.key
    volumes:
      - certs_data:/certs:ro
    depends_on:
      certs-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      kafka_e:
        condition: service_started

  payment-gateway:
    build:
      context: .
      dockerfile: payment-gateway/Dockerfile
    container_name: payment-gateway
    restart: unless-stopped
    env_file:
      - ./payment-service/.env
    environment:
      PORT: 3012
      PG_HOST: postgres
      PG_PORT: 5432
      PG_DATABASE: payment_gateway
      PG_USER: postgres
      PG_PASSWORD: postgres
      KAFKA_BROKER: kafka-e:29092
      TLS_ENABLED: "true"
      TLS_REQUEST_CLIENT_CERT: "true"
      TLS_REJECT_UNAUTHORIZED: "true"
      TLS_CA_PATH: /certs/ca/ca.crt
      TLS_CERT_PATH: /certs/payment-gateway/tls.crt
      TLS_KEY_PATH: /certs/payment-gateway/tls.key
    volumes:
      - certs_data:/certs:ro
    depends_on:
      certs-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      kafka_e:
        condition: service_started

  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    container_name: api-gateway
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      AUTH_SERVICE_URL: https://auth-service:3001
      USER_SERVICE_URL: https://user-service:3002
      SHOP_SERVICE_URL: https://shop-service:3003
      PRODUCT_SERVICE_URL: https://product-service:3004
      INVENTORY_SERVICE_URL: https://inventory-service:3007
      VOUCHER_SERVICE_URL: https://voucher-service:3013
      CART_SERVICE_URL: https://cart-service:3005
      ORDER_SERVICE_URL: https://order-service:3006
      PAYMENT_SERVICE_URL: https://payment-service:3010
      WALLET_SERVICE_URL: https://wallet-service:3011
      PAYMENT_GATEWAY_URL: https://payment-gateway:3012
      REVIEW_SERVICE_URL: https://review-service:3008
      CHAT_SERVICE_URL: https://chat-service:3009
      CHATBOT_SERVICE_URL: ${ASSISTANT_SERVICE_URL:-http://agentic-rag:3030}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-60000}
      RATE_LIMIT_MAX_REQUESTS: ${RATE_LIMIT_MAX_REQUESTS:-600}
      AUTH_RATE_LIMIT_WINDOW_MS: ${AUTH_RATE_LIMIT_WINDOW_MS:-60000}
      AUTH_RATE_LIMIT_MAX_REQUESTS: ${AUTH_RATE_LIMIT_MAX_REQUESTS:-30}
      RATE_LIMIT_EXEMPT_PATH_PREFIXES: ${RATE_LIMIT_EXEMPT_PATH_PREFIXES:-/uploads}
      MTLS_ENABLED: "true"
      MTLS_REJECT_UNAUTHORIZED: "true"
      MTLS_CA_PATH: /certs/ca/ca.crt
      MTLS_CLIENT_CERT_PATH: /certs/api-gateway/tls.crt
      MTLS_CLIENT_KEY_PATH: /certs/api-gateway/tls.key
    volumes:
      - certs_data:/certs:ro
    depends_on:
      certs-init:
        condition: service_completed_successfully
      auth-service:
        condition: service_started
      user-service:
        condition: service_started
      shop-service:
        condition: service_started
      product-service:
        condition: service_started
      inventory-service:
        condition: service_started
      voucher-service:
        condition: service_started
      cart-service:
        condition: service_started
      order-service:
        condition: service_started
      review-service:
        condition: service_started
      chat-service:
        condition: service_started
      payment-service:
        condition: service_started
      wallet-service:
        condition: service_started
      payment-gateway:
        condition: service_started

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      api-gateway:
        condition: service_started

volumes:
  certs_data:
  mongo_data:
  postgres_data:
  kafka_data:
  minio_data:
  chatbot_vectors:
  chatbot_data:
